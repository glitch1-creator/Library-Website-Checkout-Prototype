<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pay</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="JScript/pay.js"></script>
  </head>

  <body>
    <!-- logo -->
    <div class="logo"></div>

    <div class="text-With-Nav">
      <!-- Intro -->
      <h1>Book Payment</h1>
      <p>Complete Your Purchase Securely.</p>
      <!-- NAVIGATION -->
      <nav class="">
        <a href="index.html" class="active-link">Home</a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
      </nav>
    </div>

    <!-- container for the entire credit card info -->
    <div class="card-details-container">
      <!-- sub containers -->
      <div class="card-type">
        <p>Credit / Debit card</p>
        <img src="Images/visaImgg.png" alt="" width="80px" id="card-type-img" />
      </div>

      <div class="card-info">
        <p id="cardNo">Card number</p>
        <input
          placeholder="eg.1254 4584 7856"
          id="cardNoDigits"
          type="text"
          maxlength="16"
        />
        <div class="expDate">
          <p>
            EXPIRATION MONTH
            <input type="text" placeholder="MM" maxlength="2" id="expMonthID" />
          </p>

          <p>
            EXPIRATION YEAR
            <input
              type="text"
              placeholder="YYYY"
              maxlength="4"
              id="expYearID"
            />
          </p>

          <p>
            CVC
            <input
              type="text"
              placeholder="CVC 3-4 digit number on the back of card"
              maxlength="4"
              id="cvcCode"
            />
          </p>

          <button id="paySafeBTN">Pay Securely</button>
        </div>
      </div>

      <h3 id="footer-text">Your payment info is encrypted and safe</h3>
    </div>
  </body>
</html>
