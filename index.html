<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="JScript/home.js"></script>
  </head>

  <body>
    <!-- logo -->
    <div class="logo"></div>

    <div class="text-With-Nav">
      <!-- Intro -->
      <p>Discover Worlds. Ignite Imagination</p>
      <h1>Stories that</h1>
      <h1>stay with <span class="highlighted">you.</span></h1>
      <!-- NAVIGATION -->
      <nav class="">
        <a href="index.html" class="active-link">Home</a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
      </nav>
    </div>

    <!--BOOKS CONTAINER-->
    <div class="bookContainer">
      <!--Left side 2 books-->
      <div class="LsideBooks">
        <!-- first book info -->
        <div class="trmib">
          <img src="Images/TRMIB.png" alt="" class="trmib-img" />
          <div class="trmibDetails">
            <p class="BookTitle highlighted">As A Man Thinketh</p>
            <p class="author">by George S Clarson</p>
            <button
              type="button"
              class="buttonPay"
              data-image="Images/TRMIB.png"
            >
              Pay
            </button>
          </div>
        </div>

        <!-- second book info -->
        <div class="richDad">
          <img src="Images/richDad.png" alt="" class="richDad-img" />
          <div class="richDadDetails">
            <p class="BookTitle highlighted">Rich Dad Poor Dad</p>
            <p class="author">by Robert Kiyosaki</p>
            <button
              type="button"
              class="buttonPay"
              data-image="Images/richDad.png"
            >
              Pay
            </button>
          </div>
        </div>
      </div>

      <!-- middle Section-->

      <!-- RIGHT SIDE 2 BOOOKS -->
      <div class="RsideBooks">
        <!-- third book and it's info -->
        <div class="hemAndHaw">
          <img src="Images/hemANDhaw.png" alt="" class="hew-img" />
          <div class="WhoMovedMyChess-Details">
            <p class="BookTitle highlighted">Who Moved My Cheese</p>
            <p class="author">by Dr. Spencer Johnson</p>
            <button
              type="button"
              class="buttonPay"
              data-image="Images/hemANDhaw.png"
            >
              Pay
            </button>
          </div>
        </div>

        <!-- fouth bookk and it's info -->
        <div class="AmanThinketh">
          <img
            src="Images/AsAmanThinketh.png"
            alt=""
            class="AmanThinketh-img"
          />
          <div class="AsManThinketh-Details">
            <p class="BookTitle highlighted">As A Man Thinketh</p>
            <p class="author">by James Allen</p>
            <button
              type="button"
              class="buttonPay"
              data-image="Images/AsAmanThinketh.png"
            >
              Pay
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
